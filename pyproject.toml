[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bmsync"
version = "1.0.0"
description = "macOS 上 Chrome ↔ Safari 书签双向同步（纯标准库实现）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "bmsync contributors" }]
keywords = ["bookmarks", "chrome", "safari", "sync", "macos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Battle-l/bmsync"
Issues = "https://github.com/Battle-l/bmsync/issues"

# 运行不需要任何第三方依赖；测试也只用标准库。
# 这里只写"开发时可选"的工具，方便想跑 lint 的贡献者。
[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# 保持宽松：这个项目优先可读性，不做过度检查
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
