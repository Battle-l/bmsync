name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # 这个项目只针对 macOS（读写 Safari 的 Bookmarks.plist、launchd 定时任务）
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法检查
        run: python -m py_compile bmsync.py

      - name: 环境自检（不依赖真实书签，允许非 0 退出）
        run: |
          python bmsync.py doctor || true

      - name: 跑端到端测试
        # CI 上没有真实 Chrome 书签，测试会自动回退到合成夹具
        env:
          BMSYNC_TEST_CHROME: /nonexistent
        run: python tests/test_bmsync.py

      - name: 命令行接口冒烟测试
        run: |
          python bmsync.py --version
          python bmsync.py --help
          python bmsync.py sync --help
          python bmsync.py export --help
          python bmsync.py install-scheduler --dry-run --interval 30

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install ruff
          ruff check --output-format=github .
